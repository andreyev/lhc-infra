apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applicationset-manager
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: {{ .Values.repository }}
        revision: {{ .Values.branch }}
        directories:
          - path: 'roles/base'
        helm:
          valueFiles:
          - values.yaml
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: {{ .Values.repository }}
        targetRevision: {{ .Values.branch }}
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

