apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-appsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andreyev/lhc-infra.git
    targetRevision: add_roles
    path: argo/bootstrap-appsets
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
